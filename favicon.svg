<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#06090f"/>
  <!-- Train body -->
  <rect x="6" y="10" width="20" height="12" rx="3" fill="#e8a849"/>
  <!-- Windshield -->
  <rect x="9" y="12" width="6" height="5" rx="1" fill="#06090f"/>
  <rect x="17" y="12" width="6" height="5" rx="1" fill="#06090f"/>
  <!-- Headlight -->
  <rect x="3" y="14" width="3" height="4" rx="1.5" fill="#e8a849"/>
  <!-- Bottom rail -->
  <rect x="4" y="24" width="24" height="2" rx="1" fill="#e8a849" opacity="0.6"/>
  <!-- Wheels -->
  <circle cx="11" cy="23" r="2" fill="#06090f" stroke="#e8a849" stroke-width="1"/>
  <circle cx="21" cy="23" r="2" fill="#06090f" stroke="#e8a849" stroke-width="1"/>
  <!-- Roof detail -->
  <rect x="12" y="7" width="8" height="3" rx="1.5" fill="#e8a849" opacity="0.8"/>
</svg>
