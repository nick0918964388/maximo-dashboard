<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車輛運用歷程 — 台鐵車輛管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   RESET & VARIABLES
   ═══════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --font-display: 'Outfit', 'Noto Sans TC', sans-serif;
  --font-body: 'Noto Sans TC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* ═══ DARK THEME ═══ */
[data-theme="dark"] {
  --bg-primary: #06090f;
  --bg-secondary: #0c1220;
  --bg-card: rgba(14, 22, 38, 0.75);
  --bg-card-hover: rgba(20, 32, 56, 0.85);
  --bg-glass: rgba(255, 255, 255, 0.03);
  --border-glass: rgba(255, 255, 255, 0.06);
  --border-glow: rgba(232, 168, 73, 0.15);
  --text-primary: #e8edf5;
  --text-secondary: #7a8ba8;
  --text-muted: #4a5873;
  --text-accent: #e8a849;
  --accent-copper: #e8a849;
  --accent-copper-dim: rgba(232, 168, 73, 0.12);
  --accent-copper-glow: rgba(232, 168, 73, 0.3);
  --color-e: #4a90d9;
  --color-e-bg: rgba(74, 144, 217, 0.1);
  --color-e-border: rgba(74, 144, 217, 0.25);
  --color-e-glow: rgba(74, 144, 217, 0.4);
  --color-emu: #2dd4a0;
  --color-emu-bg: rgba(45, 212, 160, 0.1);
  --color-emu-border: rgba(45, 212, 160, 0.25);
  --color-emu-glow: rgba(45, 212, 160, 0.4);
  --color-dr: #f59e0b;
  --color-dr-bg: rgba(245, 158, 11, 0.1);
  --color-dr-border: rgba(245, 158, 11, 0.25);
  --color-dr-glow: rgba(245, 158, 11, 0.4);
  --color-pp: #a78bfa;
  --color-pp-bg: rgba(167, 139, 250, 0.1);
  --color-pp-border: rgba(167, 139, 250, 0.25);
  --color-pp-glow: rgba(167, 139, 250, 0.4);
  --color-ck: #f472b6;
  --color-ck-bg: rgba(244, 114, 182, 0.1);
  --color-ck-border: rgba(244, 114, 182, 0.25);
  --color-ck-glow: rgba(244, 114, 182, 0.4);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
  --shadow-glow: 0 0 40px rgba(232, 168, 73, 0.06);
  --card-footer-bg: rgba(0, 0, 0, 0.15);
  --grid-line-color: rgba(255,255,255,0.012);
  --grid-tick-color: rgba(255,255,255,0.03);
  --scrollbar-color: #4a5873;
  --tl-green: #2dd4a0; --tl-yellow: #f59e0b; --tl-red: #ef4444;
  --tl-green-bg: rgba(45,212,160,0.15); --tl-yellow-bg: rgba(245,158,11,0.15); --tl-red-bg: rgba(239,68,68,0.15);
  --table-row-alt: rgba(255,255,255,0.015);
  --table-row-hover: rgba(255,255,255,0.04);
}

/* ═══ LIGHT THEME ═══ */
[data-theme="light"] {
  --bg-primary: #f0f2f7;
  --bg-secondary: #e4e8f0;
  --bg-card: rgba(255, 255, 255, 0.82);
  --bg-card-hover: rgba(255, 255, 255, 0.95);
  --bg-glass: rgba(0, 0, 0, 0.025);
  --border-glass: rgba(0, 0, 0, 0.08);
  --border-glow: rgba(180, 120, 40, 0.2);
  --text-primary: #1a2035;
  --text-secondary: #556178;
  --text-muted: #8d9bb5;
  --text-accent: #b87a1a;
  --accent-copper: #c07818;
  --accent-copper-dim: rgba(192, 120, 24, 0.1);
  --accent-copper-glow: rgba(192, 120, 24, 0.25);
  --color-e: #2563eb;
  --color-e-bg: rgba(37, 99, 235, 0.08);
  --color-e-border: rgba(37, 99, 235, 0.2);
  --color-e-glow: rgba(37, 99, 235, 0.3);
  --color-emu: #059669;
  --color-emu-bg: rgba(5, 150, 105, 0.08);
  --color-emu-border: rgba(5, 150, 105, 0.2);
  --color-emu-glow: rgba(5, 150, 105, 0.3);
  --color-dr: #d97706;
  --color-dr-bg: rgba(217, 119, 6, 0.08);
  --color-dr-border: rgba(217, 119, 6, 0.2);
  --color-dr-glow: rgba(217, 119, 6, 0.3);
  --color-pp: #7c3aed;
  --color-pp-bg: rgba(124, 58, 237, 0.08);
  --color-pp-border: rgba(124, 58, 237, 0.2);
  --color-pp-glow: rgba(124, 58, 237, 0.3);
  --color-ck: #db2777;
  --color-ck-bg: rgba(219, 39, 119, 0.08);
  --color-ck-border: rgba(219, 39, 119, 0.2);
  --color-ck-glow: rgba(219, 39, 119, 0.3);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-glow: 0 0 30px rgba(192, 120, 24, 0.05);
  --card-footer-bg: rgba(0, 0, 0, 0.03);
  --grid-line-color: rgba(0,0,0,0.04);
  --grid-tick-color: rgba(0,0,0,0.06);
  --scrollbar-color: #c0c8d8;
  --tl-green: #059669; --tl-yellow: #d97706; --tl-red: #dc2626;
  --tl-green-bg: rgba(5,150,105,0.12); --tl-yellow-bg: rgba(217,119,6,0.12); --tl-red-bg: rgba(220,38,38,0.12);
  --table-row-alt: rgba(0,0,0,0.02);
  --table-row-hover: rgba(0,0,0,0.04);
}

html { scroll-behavior: smooth; }

html.theme-transition,
html.theme-transition *,
html.theme-transition *::before,
html.theme-transition *::after {
  transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease,
              box-shadow 0.4s ease, opacity 0.4s ease !important;
}

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══ BACKGROUND ═══ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(74, 144, 217, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(232, 168, 73, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse 50% 60% at 50% 100%, rgba(45, 212, 160, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

[data-theme="light"] body::before {
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(37, 99, 235, 0.05) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(192, 120, 24, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse 50% 60% at 50% 100%, rgba(5, 150, 105, 0.03) 0%, transparent 50%);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid-line-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* ═══ SKELETON LOADING ═══ */
@keyframes skeleton-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--border-glass) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s ease-in-out infinite;
  border-radius: var(--radius-sm);
  color: transparent !important;
  -webkit-text-fill-color: transparent !important;
  pointer-events: none;
  user-select: none;
}
.skeleton * { visibility: hidden; }
.skeleton-line {
  display: inline-block;
  height: 1em;
  min-width: 80px;
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--border-glass) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s ease-in-out infinite;
  border-radius: 4px;
}
.skeleton-block {
  height: 20px;
  margin-bottom: 12px;
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--border-glass) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s ease-in-out infinite;
  border-radius: 4px;
}

/* ═══ LAYOUT ═══ */
.app { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto; padding: 0 32px 80px; }

/* ═══ HEADER ═══ */
.header {
  padding: 32px 0 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border-glass);
  margin-bottom: 32px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-md);
  padding: 10px 20px;
  cursor: pointer;
  backdrop-filter: blur(20px);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
}

.back-btn:hover {
  color: var(--accent-copper);
  border-color: var(--accent-copper);
  box-shadow: 0 0 16px var(--accent-copper-dim);
}

.header-vehicle-id {
  font-family: var(--font-display);
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}

.header-badges { display: flex; align-items: center; gap: 8px; }

.type-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 100px;
}

.type-badge.e { background: var(--color-e-bg); color: var(--color-e); border: 1px solid var(--color-e-border); }
.type-badge.emu { background: var(--color-emu-bg); color: var(--color-emu); border: 1px solid var(--color-emu-border); }
.type-badge.dr { background: var(--color-dr-bg); color: var(--color-dr); border: 1px solid var(--color-dr-border); }
.type-badge.pp { background: var(--color-pp-bg); color: var(--color-pp); border: 1px solid var(--color-pp-border); }
.type-badge.ck { background: var(--color-ck-bg); color: var(--color-ck); border: 1px solid var(--color-ck-border); }

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 100px;
}

.status-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.status-badge.green { color: var(--tl-green); background: var(--tl-green-bg); }
.status-badge.green .dot { background: var(--tl-green); box-shadow: 0 0 8px var(--tl-green); }
.status-badge.yellow { color: var(--tl-yellow); background: var(--tl-yellow-bg); }
.status-badge.yellow .dot { background: var(--tl-yellow); box-shadow: 0 0 8px var(--tl-yellow); }
.status-badge.red { color: var(--tl-red); background: var(--tl-red-bg); }
.status-badge.red .dot { background: var(--tl-red); box-shadow: 0 0 8px var(--tl-red); }

.header-spacer { flex: 1; }

.report-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  color: #06090f;
  background: linear-gradient(135deg, var(--accent-copper), #d4922e);
  border: none;
  border-radius: var(--radius-md);
  padding: 10px 24px;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 4px 16px rgba(232, 168, 73, 0.3);
}

.report-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(232, 168, 73, 0.45);
}

.theme-toggle {
  position: relative;
  width: 56px;
  height: 30px;
  border-radius: 100px;
  border: 1px solid var(--border-glass);
  background: var(--bg-card);
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}

.theme-toggle:hover { border-color: var(--accent-copper); box-shadow: 0 0 16px var(--accent-copper-dim); }

.theme-toggle-track { position: absolute; inset: 3px; border-radius: 100px; overflow: hidden; }

.theme-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent-copper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

[data-theme="light"] .theme-toggle-thumb { left: calc(100% - 24px); background: #f59e0b; }

/* ═══ ANIMATIONS ═══ */
@keyframes card-in {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-copper-glow); }
  50% { opacity: 0.6; box-shadow: 0 0 0 6px transparent; }
}

/* ═══ SECTION TITLES ═══ */
.section-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 20px;
  background: var(--accent-copper);
  border-radius: 4px;
}

/* ═══ TWO-COLUMN TOP ═══ */
.top-row {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 20px;
  margin-bottom: 32px;
}

/* ═══ GLASSMORPHISM PANEL ═══ */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  padding: 28px;
  backdrop-filter: blur(24px);
  opacity: 0;
  transform: translateY(20px);
  animation: card-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.panel.delay-1 { animation-delay: 0.1s; }
.panel.delay-2 { animation-delay: 0.2s; }
.panel.delay-3 { animation-delay: 0.35s; }
.panel.delay-4 { animation-delay: 0.5s; }
.panel.delay-5 { animation-delay: 0.65s; }

/* ═══ INFO GRID ═══ */
.info-grid { display: flex; flex-direction: column; gap: 14px; }

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-glass);
}

.info-row:last-child { border-bottom: none; padding-bottom: 0; }

.info-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 400;
}

.info-value {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

/* ═══ STAT ROW ═══ */
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat-item {
  text-align: center;
  padding: 16px;
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-md);
}

.stat-number {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
}

.stat-number .unit {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-left: 2px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.chart-container { position: relative; height: 200px; }

/* ═══ FILTER CHIPS ═══ */
.filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.filter-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-right: 4px;
}

.chip {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 100px;
  border: 1px solid var(--border-glass);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.25s;
  backdrop-filter: blur(10px);
  user-select: none;
}

.chip:hover { border-color: var(--text-muted); color: var(--text-primary); }

.chip.active {
  background: linear-gradient(135deg, rgba(232, 168, 73, 0.15), rgba(232, 168, 73, 0.05));
  border-color: var(--accent-copper);
  color: var(--accent-copper);
  box-shadow: 0 0 20px rgba(232, 168, 73, 0.1);
}

/* ═══ DATA TABLE ═══ */
.table-wrapper {
  max-height: 420px;
  overflow-y: auto;
  border-radius: var(--radius-md);
}

.table-wrapper::-webkit-scrollbar { width: 4px; }
.table-wrapper::-webkit-scrollbar-track { background: transparent; }
.table-wrapper::-webkit-scrollbar-thumb { background: var(--scrollbar-color); border-radius: 4px; }

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.data-table thead { position: sticky; top: 0; z-index: 2; }

.data-table th {
  background: var(--bg-secondary);
  color: var(--text-muted);
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border-glass);
  white-space: nowrap;
}

.data-table td {
  padding: 11px 14px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-glass);
  vertical-align: middle;
}

.data-table tbody tr:nth-child(even) { background: var(--table-row-alt); }
.data-table tbody tr:hover { background: var(--table-row-hover); }

.data-table .mono {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
}

/* Train pills */
.train-pills { display: flex; flex-wrap: wrap; gap: 4px; }

.train-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 100px;
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
  color: var(--text-secondary);
  white-space: nowrap;
}

/* Status / type mini badges */
.mini-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 100px;
  white-space: nowrap;
}

.mini-badge.maint-regular { background: var(--color-e-bg); color: var(--color-e); }
.mini-badge.maint-wheel { background: var(--color-dr-bg); color: var(--color-dr); }
.mini-badge.maint-brake { background: var(--color-emu-bg); color: var(--color-emu); }
.mini-badge.maint-electric { background: rgba(139,92,246,0.1); color: #8b5cf6; }
.mini-badge.maint-body { background: var(--accent-copper-dim); color: var(--accent-copper); }

.mini-badge.status-done { background: var(--tl-green-bg); color: var(--tl-green); }
.mini-badge.status-progress { background: var(--tl-yellow-bg); color: var(--tl-yellow); }
.mini-badge.status-planned { background: var(--color-e-bg); color: var(--color-e); }

.mini-badge.sev-high { background: var(--tl-red-bg); color: var(--tl-red); }
.mini-badge.sev-medium { background: var(--tl-yellow-bg); color: var(--tl-yellow); }
.mini-badge.sev-low { background: var(--tl-green-bg); color: var(--tl-green); }

/* ═══ KPI INDICATOR CARDS (MTBF / MDBF / MTTR) ═══ */
.kpi-section {
  margin-bottom: 32px;
}

.kpi-section .section-title {
  margin-bottom: 16px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  backdrop-filter: blur(24px);
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(20px);
  animation: card-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.kpi-card:nth-child(1) { animation-delay: 0.45s; }
.kpi-card:nth-child(2) { animation-delay: 0.55s; }
.kpi-card:nth-child(3) { animation-delay: 0.65s; }

.kpi-card:hover {
  border-color: var(--border-glow);
  box-shadow: var(--shadow-glow);
}

/* Decorative gradient strip at top */
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.kpi-card.kpi-green::before { background: linear-gradient(90deg, var(--tl-green), transparent); }
.kpi-card.kpi-yellow::before { background: linear-gradient(90deg, var(--tl-yellow), transparent); }
.kpi-card.kpi-red::before { background: linear-gradient(90deg, var(--tl-red), transparent); }

.kpi-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.kpi-abbr {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 100px;
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
}

.kpi-card.kpi-green .kpi-abbr { color: var(--tl-green); border-color: rgba(45, 212, 160, 0.2); background: rgba(45, 212, 160, 0.08); }
.kpi-card.kpi-yellow .kpi-abbr { color: var(--tl-yellow); border-color: rgba(245, 158, 11, 0.2); background: rgba(245, 158, 11, 0.08); }
.kpi-card.kpi-red .kpi-abbr { color: var(--tl-red); border-color: rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.08); }

.kpi-trend {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 100px;
}

.kpi-trend.up { color: var(--tl-green); background: rgba(45, 212, 160, 0.1); }
.kpi-trend.down { color: var(--tl-red); background: rgba(239, 68, 68, 0.1); }
.kpi-trend.flat { color: var(--tl-yellow); background: rgba(245, 158, 11, 0.1); }

.kpi-body {
  display: flex;
  align-items: flex-end;
  gap: 20px;
}

.kpi-metric {
  flex: 1;
}

.kpi-value {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 800;
  line-height: 1;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.kpi-value .kpi-unit {
  font-size: 15px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-left: 4px;
}

.kpi-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
}

.kpi-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.kpi-sub-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.kpi-sub-dot.green { background: var(--tl-green); box-shadow: 0 0 6px rgba(45, 212, 160, 0.5); }
.kpi-sub-dot.yellow { background: var(--tl-yellow); box-shadow: 0 0 6px rgba(245, 158, 11, 0.5); }
.kpi-sub-dot.red { background: var(--tl-red); box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }

/* Ring gauge */
.kpi-ring-wrap {
  flex-shrink: 0;
  position: relative;
  width: 72px;
  height: 72px;
}

.kpi-ring-wrap svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.kpi-ring-bg {
  fill: none;
  stroke: var(--border-glass);
  stroke-width: 6;
}

.kpi-ring-fill {
  fill: none;
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.kpi-card.kpi-green .kpi-ring-fill { stroke: var(--tl-green); filter: drop-shadow(0 0 4px rgba(45, 212, 160, 0.4)); }
.kpi-card.kpi-yellow .kpi-ring-fill { stroke: var(--tl-yellow); filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
.kpi-card.kpi-red .kpi-ring-fill { stroke: var(--tl-red); filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.4)); }

.kpi-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.kpi-ring-pct {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
}

.kpi-ring-label {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
  letter-spacing: 0.5px;
}

@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: 1fr; }
}

@media (max-width: 640px) {
  .kpi-card { padding: 20px; }
  .kpi-value { font-size: 30px; }
}

/* ═══ TWO-COLUMN BOTTOM ═══ */
.bottom-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}

/* ═══ MODAL ═══ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-card {

  overflow-y: auto;

.modal-title {

.modal-title::before {

.form-input,
.form-select,

}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {

.form-input[readonly] { opacity: 0.6; cursor: not-allowed; }

.form-select {

.btn-cancel:hover { border-color: var(--text-muted); color: var(--text-primary); }

.btn-submit {

/* ═══ TOAST ═══ */
.toast {

/* ═══ FOOTER ═══ */

<script src="js/config.js?v=20260312c"></script>
<script src="js/shared.js?v=20260312c"></script>
<script src="js/api-client.js?v=20260312c"></script>
<script src="js/mock-data.js?v=20260312c"></script>
<script src="js/data-service.js?v=20260312c"></script>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const params = new URLSearchParams(window.location.search);
const vehicleId = params.get('id') || 'E315';

let mileageChart = null;
let currentDayFilter = 30;
let cachedOperations = []; // 快取 operations 供 filter 使用

// ═══════════════════════════════════════════
// RENDER PAGE (async — via DataService)
// ═══════════════════════════════════════════
function showSkeleton(id, rows = 4) {
  const el = document.getElementById(id);
  if (!el) return;
  const lines = Array.from({length: rows}, (_, i) =>
    `<div class="skeleton-block" style="width:${70 + Math.random() * 25}%; animation-delay:${i * 0.1}s"></div>`
  ).join('');
  el.innerHTML = lines;
}

async function renderPage() {
  // Show skeleton loading in all content areas
  showSkeleton('infoGrid', 6);
  showSkeleton('statRow', 2);
  document.getElementById('historyBody').innerHTML =
    Array.from({length: 5}, (_, i) => `<tr>${'<td><div class="skeleton-block" style="margin:0;height:16px;animation-delay:' + (i*0.08) + 's"></div></td>'.repeat(6)}</tr>`).join('');
  document.getElementById('maintBody').innerHTML =
    Array.from({length: 3}, (_, i) => `<tr>${'<td><div class="skeleton-block" style="margin:0;height:16px;animation-delay:' + (i*0.08) + 's"></div></td>'.repeat(4)}</tr>`).join('');
  document.getElementById('faultBody').innerHTML =
    Array.from({length: 3}, (_, i) => `<tr>${'<td><div class="skeleton-block" style="margin:0;height:16px;animation-delay:' + (i*0.08) + 's"></div></td>'.repeat(5)}</tr>`).join('');
  showSkeleton('kpiGrid', 3);

  // Parallel load all 4 APIs
  const [detailResp, maintResp, faultResp, kpiResp] = await Promise.allSettled([
    dataService.getVehicleDetail(vehicleId, 30),
    dataService.getMaintHistory(vehicleId, 90),
    dataService.getFaultHistory(vehicleId, 180),
    dataService.getVehicleKPI(vehicleId, 365)
  ]);

  // ── Vehicle Detail ──
  if (detailResp.status === 'fulfilled') {
    const detail = detailResp.value.data;
    renderHeader(detail.asset);
    renderInfoGrid(detail.asset);
    renderStats(detail.asset.type, detail.mileage);
    renderChartFromAPI(detail.asset.type, detail.mileageChart);
    cachedOperations = detail.operations;
    renderHistory(cachedOperations);
  } else {
    console.error('[vehicle-history] getVehicleDetail 失敗:', detailResp.reason);
    showError('infoGrid', '載入車輛資料失敗', renderPage);
    showError('historyBody', '載入運用紀錄失敗', renderPage);
  }

  // ── Maintenance History ──
  if (maintResp.status === 'fulfilled') {
    renderMaintenance(maintResp.value.data);
  } else {
    console.error('[vehicle-history] getMaintHistory 失敗:', maintResp.reason);
    showError('maintBody', '載入保養紀錄失敗', renderPage);
  }

  // ── Fault History ──
  if (faultResp.status === 'fulfilled') {
    renderFaults(faultResp.value.data);
  } else {
    console.error('[vehicle-history] getFaultHistory 失敗:', faultResp.reason);
    showError('faultBody', '載入故障紀錄失敗', renderPage);
  }

  // ── KPI ──
  if (kpiResp.status === 'fulfilled') {
    renderKPIs(kpiResp.value.data);
  } else {
    console.error('[vehicle-history] getVehicleKPI 失敗:', kpiResp.reason);
    showError('kpiGrid', '載入 KPI 失敗', renderPage);
  }
}

// ═══════════════════════════════════════════
// RENDER: HEADER
// ═══════════════════════════════════════════
function renderHeader(asset) {
  const titleEl = document.getElementById('vehicleIdTitle');
  titleEl.textContent = asset.id;
  titleEl.classList.remove('skeleton');
  titleEl.style.minWidth = '';

  document.getElementById('footerVehicle').textContent = asset.id;
  document.title = `${asset.id} 運用歷程 — 台鐵車輛管理`;

  // Type badge
  const tb = document.getElementById('typeBadge');
  tb.textContent = asset.typeLabel;
  tb.className = 'type-badge ' + asset.type;

  // Status badge
  const sb = document.getElementById('statusBadge');
  const statusColor = asset.statusColor || (asset.status === 'available' || asset.status === 'operating' ? 'green' : (asset.status === 'transit' ? 'yellow' : 'red'));
  sb.className = 'status-badge ' + statusColor;
  sb.innerHTML = `<div class="dot"></div><span>${asset.statusLabel}</span>`;

  // Show badges
  document.getElementById('headerBadges').style.visibility = '';

  // Modal vehicle ID
  document.getElementById('modalVehicleId').value = asset.id;
}

// ═══════════════════════════════════════════
// RENDER: INFO GRID
// ═══════════════════════════════════════════
function renderInfoGrid(asset) {
  const statusColor = asset.statusColor || (asset.status === 'available' || asset.status === 'operating' ? 'green' : (asset.status === 'transit' ? 'yellow' : 'red'));
  document.getElementById('infoGrid').innerHTML = [
    ['車號', asset.id],
    ['車型', asset.typeLabel],
    ['運用號碼', asset.opCode || '—'],
    ['配屬段', asset.depotName || '—'],
    ['維護代碼', asset.ma || '—'],
    ['目前狀態', `<span style="color: var(--tl-${statusColor})">${asset.statusLabel}</span>`]
  ].map(([label, value]) =>
    `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`
  ).join('');
}

// ═══════════════════════════════════════════
// RENDER: STATS
// ═══════════════════════════════════════════
function renderStats(type, mileage) {
  document.getElementById('statRow').innerHTML = `
    <div class="stat-item">
      <div class="stat-number" style="color: ${getTypeColor(type)}">${mileage.monthlyKm.toLocaleString()}<span class="unit">km</span></div>
      <div class="stat-label">本月里程</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" style="color: ${getTypeColor(type)}">${(mileage.yearlyKm / 1000).toFixed(1)}<span class="unit">千km</span></div>
      <div class="stat-label">本年里程（預估）</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" style="color: ${getTypeColor(type)}">${mileage.dailyAvgKm.toFixed(1)}<span class="unit">km</span></div>
      <div class="stat-label">日均里程</div>
    </div>
  `;
}

// ═══════════════════════════════════════════
// RENDER: MILEAGE CHART (from API data)
// ═══════════════════════════════════════════
function renderChartFromAPI(type, chartData) {
  const ctx = document.getElementById('mileageChart').getContext('2d');
  if (mileageChart) mileageChart.destroy();

  const labels = chartData.map(d => {
    const parts = d.date.split('-');
    return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
  });
  const data = chartData.map(d => d.km);
  const colorHex = getTypeColorHex(type);

  mileageChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colorHex + '80',
        borderColor: colorHex,
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10, 14, 26, 0.95)',
          titleColor: '#e8edf5',
          bodyColor: '#7a8ba8',
          borderColor: 'rgba(232, 168, 73, 0.2)',
          borderWidth: 1,
          cornerRadius: 8,
          padding: 10,
          bodyFont: { family: 'JetBrains Mono', size: 12 },
          callbacks: { label: ctx => ` ${ctx.parsed.y} km` }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: 'var(--text-muted)', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.03)' },
          ticks: { color: 'var(--text-muted)', font: { size: 10 } },
          beginAtZero: true,
        }
      }
    }
  });
}

// ═══════════════════════════════════════════
// RENDER: OPERATION HISTORY TABLE
// ═══════════════════════════════════════════
function renderHistory(operations) {
  const tbody = document.getElementById('historyBody');
  let filtered = operations;

  if (currentDayFilter > 0) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - currentDayFilter);
    filtered = operations.filter(r => {
      const d = new Date(r.date); // ISO date format from API
      return d >= cutoff;
    });
  }

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px;">無符合條件的紀錄</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const trainPills = r.trains.map(t => `<span class="train-pill">${t}</span>`).join('');
    const ctrlBadgeClass = r.ctrl === 'A' ? 'maint-regular' : r.ctrl === 'B' ? 'maint-wheel' : 'maint-brake';
    // Display date in slash format for UI consistency
    const displayDate = toSlashDate(r.date);
    return `
      <tr>
        <td class="mono">${displayDate}</td>
        <td class="mono">${r.opCode}</td>
        <td><div class="train-pills">${trainPills}</div></td>
        <td class="mono">${r.start || '—'} → ${r.end || '—'}</td>
        <td class="mono">${r.mileage.toFixed(1)}</td>
        <td><span class="mini-badge ${ctrlBadgeClass}">${r.ctrl} ${r.ctrlLabel || getCtrlLabel(r.ctrl)}</span></td>
      </tr>
    `;
  }).join('');
}

// ═══════════════════════════════════════════
// RENDER: MAINTENANCE HISTORY (from API)
// ═══════════════════════════════════════════
function renderMaintenance(items) {
  document.getElementById('maintTitle').innerHTML = `近期保養紀錄 <span style="font-size:0.85em;color:var(--text-secondary);">(${items.length})</span>`;
  const typeClassMap = {
    'PM': 'maint-regular',
    'CM': 'maint-wheel',
    'EM': 'maint-electric',
  };
  const statusClassMap = {
    'COMP': 'status-done',
    'INPRG': 'status-progress',
    'APPR': 'status-planned',
  };

  document.getElementById('maintBody').innerHTML = items.map(m => {
    const typeClass = typeClassMap[m.type] || 'maint-regular';
    const statusClass = statusClassMap[m.status] || 'status-planned';
    const displayDate = toSlashDate(m.date);
    return `<tr>
      <td class="mono">${displayDate}</td>
      <td><span class="mini-badge ${typeClass}">${m.typeLabel}</span></td>
      <td>${m.description}</td>
      <td><span class="mini-badge ${statusClass}">${m.statusLabel}</span></td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════
// RENDER: FAULT HISTORY (from API)
// ═══════════════════════════════════════════
function renderFaults(items) {
  document.getElementById('faultTitle').innerHTML = `近期故障紀錄 <span style="font-size:0.85em;color:var(--text-secondary);">(${items.length})</span>`;
  const sevClassMap = {
    'high': 'sev-high',
    'medium': 'sev-medium',
    'low': 'sev-low',
  };
  const statusClassMap = {
    'INPRG': 'status-progress',
    'RESOLVED': 'status-done',
  };

  document.getElementById('faultBody').innerHTML = items.map(f => {
    const sevClass = sevClassMap[f.severity] || 'sev-low';
    const statusClass = statusClassMap[f.status] || 'status-done';
    const displayDate = toSlashDate(f.date);
    return `<tr>
      <td class="mono">${displayDate}</td>
      <td class="mono">${f.failureCode}</td>
      <td>${f.description}</td>
      <td><span class="mini-badge ${sevClass}">${f.severityLabel}</span></td>
      <td><span class="mini-badge ${statusClass}">${f.statusLabel}</span></td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════
// RENDER: KPI INDICATORS (from API)
// ═══════════════════════════════════════════
function renderKPIs(kpiData) {
  function buildRingSVG(pct) {
    const r = 30;
    const circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - pct / 100);
    return `<svg viewBox="0 0 72 72">
      <circle class="kpi-ring-bg" cx="36" cy="36" r="${r}"/>
      <circle class="kpi-ring-fill" cx="36" cy="36" r="${r}"
        stroke-dasharray="${circumference}"
        stroke-dashoffset="${offset}"/>
    </svg>`;
  }

  function trendDisplay(trend, trendPct, invert) {
    // For MTTR, 'down' is good (shorter repair time), so invert arrow coloring
    if (trend === 'up') return invert ? `▲ ${trendPct}%` : `▲ ${trendPct}%`;
    if (trend === 'down') return `▼ ${trendPct}%`;
    return '— 持平';
  }

  function trendClass(trend, invert) {
    if (invert) return trend === 'down' ? 'up' : (trend === 'up' ? 'down' : 'flat');
    return trend;
  }

  const kpis = [
    {
      abbr: 'MTBF',
      value: kpiData.mtbf.value.toLocaleString(),
      unit: '小時',
      label: '兩次故障平均間隔時間',
      sub: `基準 ${kpiData.mtbf.benchmark} hr · 共 ${kpiData.mtbf.faultCount} 次故障`,
      color: kpiData.mtbf.grade,
      pct: kpiData.mtbf.pct,
      trend: kpiData.mtbf.trend,
      trendVal: trendDisplay(kpiData.mtbf.trend, kpiData.mtbf.trendPct, false),
      trendClass: trendClass(kpiData.mtbf.trend, false),
      ringLabel: '達標率',
    },
    {
      abbr: 'MDBF',
      value: kpiData.mdbf.displayValue,
      unit: 'km',
      label: '兩次故障平均里程',
      sub: `基準 ${(kpiData.mdbf.benchmark/1000).toFixed(0)}k km · 年估 ${(kpiData.mdbf.yearlyKm/1000).toFixed(0)}k km`,
      color: kpiData.mdbf.grade,
      pct: kpiData.mdbf.pct,
      trend: kpiData.mdbf.trend,
      trendVal: trendDisplay(kpiData.mdbf.trend, kpiData.mdbf.trendPct, false),
      trendClass: trendClass(kpiData.mdbf.trend, false),
      ringLabel: '達標率',
    },
    {
      abbr: 'MTTR',
      value: kpiData.mttr.value.toFixed(1),
      unit: '小時',
      label: '保養平均維修時間',
      sub: `目標 ${kpiData.mttr.target} hr · 共 ${kpiData.mttr.repairCount} 次維修`,
      color: kpiData.mttr.grade,
      pct: kpiData.mttr.pct,
      trend: kpiData.mttr.trend,
      trendVal: trendDisplay(kpiData.mttr.trend, kpiData.mttr.trendPct, true),
      trendClass: trendClass(kpiData.mttr.trend, true),
      ringLabel: '效率',
    },
  ];

  document.getElementById('kpiGrid').innerHTML = kpis.map(k => `
    <div class="kpi-card kpi-${k.color}">
      <div class="kpi-header">
        <div class="kpi-abbr">${k.abbr}</div>
        <div class="kpi-trend ${k.trendClass}">${k.trendVal}</div>
      </div>
      <div class="kpi-body">
        <div class="kpi-metric">
          <div class="kpi-value">${k.value}<span class="kpi-unit">${k.unit}</span></div>
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-sub"><div class="kpi-sub-dot ${k.color}"></div>${k.sub}</div>
        </div>
        <div class="kpi-ring-wrap">
          ${buildRingSVG(k.pct)}
          <div class="kpi-ring-text">
            <div class="kpi-ring-pct">${k.pct}%</div>
            <div class="kpi-ring-label">${k.ringLabel}</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
// FILTER CHIPS
// ═══════════════════════════════════════════
document.getElementById('filterRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#filterRow .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  currentDayFilter = parseInt(btn.dataset.days);
  renderHistory(cachedOperations);
});

// ═══════════════════════════════════════════
// MODAL (async submit via DataService)
// ═══════════════════════════════════════════
const overlay = document.getElementById('modalOverlay');

document.getElementById('openModalBtn').addEventListener('click', () => {
  overlay.classList.add('active');
});

document.getElementById('modalCancelBtn').addEventListener('click', () => {
  overlay.classList.remove('active');
});

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('active');
});

document.getElementById('modalSubmitBtn').addEventListener('click', async () => {
  const submitBtn = document.getElementById('modalSubmitBtn');
  const originalText = submitBtn.textContent;
  submitBtn.textContent = '送出中...';
  submitBtn.disabled = true;

  try {
    const statusSelect = document.getElementById('modalStatusCode');
    const remarkInput = document.getElementById('modalRemark');

    await dataService.submitDynamicReport({
      assetnum: vehicleId,
      statusCode: statusSelect ? statusSelect.value : 'repair',
      remark: remarkInput ? remarkInput.value : ''
    });

    overlay.classList.remove('active');
    const toast = document.getElementById('toast');
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 3000);
  } catch (err) {
    console.error('[vehicle-history] submitDynamicReport 失敗:', err);
    alert('送出失敗：' + err.message);
  } finally {
    submitBtn.textContent = originalText;
    submitBtn.disabled = false;
  }
});

// ═══════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════
function getTheme() { return localStorage.getItem('car-dashboard-theme') || 'dark'; }

function setTheme(theme) {
  document.documentElement.classList.add('theme-transition');
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('car-dashboard-theme', theme);
  document.getElementById('themeThumb').textContent = theme === 'dark' ? '🌙' : '☀️';
  setTimeout(() => document.documentElement.classList.remove('theme-transition'), 450);
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  setTheme(current === 'dark' ? 'light' : 'dark');
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = getTheme();
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeThumb').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
  renderPage();
});
</script>
